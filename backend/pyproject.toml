[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crm-backend"
version = "0.1.0"
description = "Multi-tenant CRM SaaS Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
