[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crm-backend"
version = "0.1.0"
description = "Multi-tenant CRM SaaS Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "argon2-cffi",
    "pyjwt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
